name: Build and Release

on:
  push:
    tags: ["*"]
  pull_request:
    branches: ["*"]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - run: cargo fmt --all -- --check
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo test --locked --all-targets

  build:
    name: Build ${{ matrix.label }}
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            label: linux-x86-64
            linker: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            ext: ""
            label: linux-arm64
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            label: linux-x86-64-old
            linker: ""
          - target: aarch64-unknown-linux-gnu
            os: ubuntu-22.04
            ext: ""
            label: linux-arm64-old
            linker: aarch64-linux-gnu-gcc
          - target: x86_64-apple-darwin
            os: macos-latest
            ext: ""
            label: macos-x86-64
            linker: ""
          - target: aarch64-apple-darwin
            os: macos-latest
            ext: ""
            label: macos-arm64
            linker: ""
          - target: x86_64-pc-windows-msvc
            os: windows-latest
            ext: ".exe"
            label: windows-x86-64
            linker: ""

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.target }}
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install cross-compilation deps (Linux ARM64)
        if: matrix.linker != ''
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq gcc-aarch64-linux-gnu g++-aarch64-linux-gnu

      - name: Set linker and C++ compiler (Linux ARM64)
        if: matrix.linker != ''
        run: |
          echo "CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_LINKER=${{ matrix.linker }}" >> $GITHUB_ENV
          echo "CXX_aarch64-unknown-linux-gnu=aarch64-linux-gnu-g++" >> $GITHUB_ENV

      - name: Build release binary
        run: cargo build --locked --release --target ${{ matrix.target }}

      - name: Rename binary with label
        shell: bash
        run: |
          src="target/${{ matrix.target }}/release/rupi${{ matrix.ext }}"
          dst="target/${{ matrix.target }}/release/rupi-${{ matrix.label }}${{ matrix.ext }}"
          mv "$src" "$dst"

      - name: Set executable permission (Unix)
        if: matrix.ext == ''
        shell: bash
        run: chmod +x "target/${{ matrix.target }}/release/rupi-${{ matrix.label }}"

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: rupi-${{ matrix.label }}
          path: target/${{ matrix.target }}/release/rupi-${{ matrix.label }}${{ matrix.ext }}
          if-no-files-found: error

  release:
    name: Release
    needs: [build, test]
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: rupi-*
          path: artifacts

      - name: List artifacts
        run: find artifacts/ -type f -ls

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          tag_name: ${{ github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
