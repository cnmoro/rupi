[package]
name = "rupi"
version = "0.8.0"
edition = "2021"
description = "Minimalistic RPC coding agent with OpenAI-compatible API support"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
clap = { version = "4", features = ["derive", "env"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "stream", "blocking", "rustls-tls"] }
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures-util = "0.3"
async-trait = "0.1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
regex = "1"
anyhow = "1"
rustyline = "14"
libc = "0.2"
half = "2"
ndarray = "0.15"
safetensors = "0.5"
tokenizers = "0.21"
model2vec-rs = "0.2"
tree-sitter = "0.25"
tree-sitter-rust = "0.24"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-java = "0.23"
tree-sitter-ruby = "0.23"
tree-sitter-c-sharp = "0.23"

[dev-dependencies]
mockito = "1"
dotenvy = "0.15"

# The binary ships as a single artifact, so the extra link time buys both a
# smaller download and better codegen across crate boundaries. `catch_unwind`
# in the bash tool rules out panic = "abort".
[profile.release]
lto = true
codegen-units = 1
strip = true
